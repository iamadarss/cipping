<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" width="540" height="960">
  <defs>
    <linearGradient id="panel_top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="panel_bottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="960" fill="#090D16"/>

  <!-- TOP PANEL: HOST -->
  <g transform="translate(24, 40)">
    <rect width="492" height="390" rx="16" fill="url(#panel_top)" stroke="#334155" stroke-width="2"/>
    <clipPath id="clip_top">
      <rect width="492" height="390" rx="16"/>
    </clipPath>
    <g clip-path="url(#clip_top)">
      <circle cx="246" cy="180" r="85" fill="#334155"/>
      <ellipse cx="246" cy="350" rx="170" ry="120" fill="#334155"/>
      <circle cx="246" cy="165" r="60" fill="#475569"/>
    </g>
    <!-- Host Badge -->
    <rect x="20" y="20" width="76" height="26" rx="6" fill="#0284C7" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="58" y="38" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#38BDF8" text-anchor="middle">HOST</text>
  </g>

  <!-- MIDDLE SEAM: SHARED KINETIC CAPTIONS -->
  <g transform="translate(270, 480)">
    <!-- Seam Separator Line -->
    <line x1="-220" y1="0" x2="220" y2="0" stroke="#334155" stroke-width="2" stroke-dasharray="6,4"/>
    <!-- Captions Box -->
    <rect x="-190" y="-30" width="380" height="60" rx="12" fill="#0B132B" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="0" y="8" font-family="'Inter', sans-serif" font-size="20" font-weight="800" text-anchor="middle">
      <tspan fill="#38BDF8">Host: </tspan>
      <tspan fill="#FFFFFF">How did you scale </tspan>
      <tspan fill="#FBBF24">so fast?</tspan>
    </text>
  </g>

  <!-- BOTTOM PANEL: GUEST -->
  <g transform="translate(24, 530)">
    <rect width="492" height="390" rx="16" fill="url(#panel_bottom)" stroke="#334155" stroke-width="2"/>
    <clipPath id="clip_bottom">
      <rect width="492" height="390" rx="16"/>
    </clipPath>
    <g clip-path="url(#clip_bottom)">
      <circle cx="246" cy="180" r="85" fill="#334155"/>
      <ellipse cx="246" cy="350" rx="170" ry="120" fill="#334155"/>
      <circle cx="246" cy="165" r="60" fill="#475569"/>
    </g>
    <!-- Guest Badge -->
    <rect x="20" y="20" width="84" height="26" rx="6" fill="#D97706" fill-opacity="0.3" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="62" y="38" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#FBBF24" text-anchor="middle">GUEST</text>
  </g>

  <!-- DualCast Tag -->
  <text x="490" y="28" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#64748B" text-anchor="end" letter-spacing="1">4 LAYOUT PRESETS</text>
</svg>